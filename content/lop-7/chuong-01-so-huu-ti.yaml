# Mẫu nội dung, cần giáo viên rà lại trước khi dùng thật.
schemaVersion: 1
lop: 7
chuong: 1
ten: Số hữu tỉ
nguon: Toán 7 Kết nối tri thức, tập 1, chương I (cần đối chiếu mục lục)
cauHoi:
  - id: l7-c1-0001
    bai: Tập hợp các số hữu tỉ
    loai: trac-nghiem
    de: "Số nào sau đây KHÔNG phải là số hữu tỉ viết dưới dạng $\\frac{a}{b}$ hợp lệ?"
    luaChon: ["$\\frac{3}{4}$", "$\\frac{-5}{2}$", "$\\frac{7}{0}$", "$0$"]
    dapAn: C
    loiGiai: "Mẫu số phải khác 0, nên $\\frac{7}{0}$ không có nghĩa."
    doKho: 1

  - id: l7-c1-0002
    bai: Cộng, trừ, nhân, chia số hữu tỉ
    loai: so
    de: "Tính $\\frac{1}{2} + \\frac{1}{3}$."
    dapAn: "5/6"
    goiY: "Quy đồng mẫu số chung là 6."
    loiGiai: "$\\frac{1}{2} + \\frac{1}{3} = \\frac{3}{6} + \\frac{2}{6} = \\frac{5}{6}$."
    doKho: 1

  - id: l7-c1-0003
    bai: Cộng, trừ, nhân, chia số hữu tỉ
    loai: so
    de: "Tính $-0{,}75 + \\frac{1}{4}$."
    dapAn: "-1/2"
    loiGiai: "$-0{,}75 = -\\frac{3}{4}$, nên tổng là $-\\frac{2}{4} = -\\frac{1}{2}$."
    doKho: 2

  - id: l7-c1-0004
    bai: Lũy thừa với số mũ tự nhiên của một số hữu tỉ
    loai: so
    de: "Tính $\\left(-\\frac{2}{3}\\right)^2$."
    dapAn: "4/9"
    doKho: 1

  - id: l7-c1-0005
    bai: Quy tắc dấu ngoặc và quy tắc chuyển vế
    loai: so
    de: "Tìm $x$, biết $x - \\frac{1}{5} = \\frac{3}{10}$."
    dapAn: "1/2"
    goiY: "Chuyển $-\\frac{1}{5}$ sang vế phải thành $+\\frac{1}{5}$."
    doKho: 2
